services:
  web:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - blog_data:/app/data
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["sh", "-lc", "while true; do ./node_modules/.bin/tsx src/cli/daily.ts; sleep 3600; done"]
    volumes:
      - blog_data:/app/data
    restart: unless-stopped

volumes:
  blog_data:
