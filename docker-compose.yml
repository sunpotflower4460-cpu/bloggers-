services:
  web:
    build: .
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - blog_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["sh", "-lc", "while true; do ./node_modules/.bin/tsx src/cli/daily.ts; sleep 3600; done"]
    volumes:
      - blog_data:/app/data
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build: .
    env_file: .env
    environment:
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    command: ["sh", "-lc", "while true; do ./node_modules/.bin/tsx src/cli/backup.ts; sleep \"$${BACKUP_INTERVAL_SECONDS}\"; done"]
    volumes:
      - blog_data:/app/data
      - ${BLOG_GARDEN_BACKUP_DIR:-./backups}:/backups
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  blog_data:
