name: app-test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check runtime syntax
        run: npm run check
      - name: Run application tests
        run: npm test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bloggers_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bloggers_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ensure PostgreSQL client
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Run real PostgreSQL integration smoke test
        env:
          BLOGGERS_REAL_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/bloggers_test
        run: node --test tests/postgres-real.test.js
